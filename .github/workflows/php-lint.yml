name: PHP Lint

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - '7.4'
          - '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
